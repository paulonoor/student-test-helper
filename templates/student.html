<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Interface - Student Test Helper</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👨‍🎓 Student Interface</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/teacher">Teacher Interface</a>
            </nav>
        </header>

        <!-- Student Name Input -->
        <section class="section">
            <div class="form-group">
                <label for="studentName">Your Name:</label>
                <input type="text" id="studentName" placeholder="Enter your name" />
            </div>
        </section>

        <!-- Available Tests Section -->
        <section class="section" id="testsListSection">
            <h2>Available Tests</h2>
            <div class="form-group">
                <label for="filterDiscipline">Filter by Discipline:</label>
                <select id="filterDiscipline" onchange="loadTests()">
                    <option value="">All Disciplines</option>
                </select>
            </div>
            <div id="availableTestsList" class="list"></div>
        </section>

        <!-- Take Test Section -->
        <section class="section" id="takeTestSection" style="display: none;">
            <div id="testHeader">
                <h2 id="testTitle"></h2>
                <p id="testDescription"></p>
                <button onclick="backToTestsList()" class="btn btn-secondary">Back to Tests</button>
            </div>
            
            <form id="testForm">
                <div id="questionsContainer"></div>
                <button type="submit" class="btn btn-primary btn-large">Submit Test</button>
            </form>
        </section>

        <!-- Results Section -->
        <section class="section" id="resultsSection" style="display: none;">
            <h2>Test Results</h2>
            <button onclick="backToTestsList()" class="btn btn-secondary">Back to Tests</button>
            
            <div class="results-summary">
                <h3>Score: <span id="scoreDisplay"></span></h3>
                <p>Correct Answers: <span id="correctCount"></span> / <span id="totalCount"></span></p>
            </div>
            
            <div id="detailedResults" class="list"></div>
        </section>
    </div>

    <script src="/static/student.js"></script>
</body>
</html>
