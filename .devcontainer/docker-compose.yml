version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=sqlite:///test_helper.db
      - FLASK_ENV=development
      - FLASK_DEBUG=true
